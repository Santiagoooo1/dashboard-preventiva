spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5433/preventiva_db
spring.datasource.username=preventiva_user
spring.datasource.password=preventiva_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.port=8080

# --- Generacion de PDF de informes (Fase 6.9R.2) ---
# Base desde la que el navegador carga /informes/{id}/imprimir. En desarrollo es
# el servidor de Vite; desplegado, la URL desde la que se sirva el frontend.
preventiva.pdf.frontend-base-url=http://localhost:5173
# Ruta a Chrome. Vacio = autodeteccion entre ubicaciones estandar.
# preventiva.pdf.chrome-executable=C:\Program Files\Google\Chrome\Application\chrome.exe
preventiva.pdf.timeout=60s
