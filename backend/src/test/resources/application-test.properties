spring.datasource.url=jdbc:postgresql://localhost:5433/preventiva_db
spring.datasource.username=preventiva_user
spring.datasource.password=preventiva_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.test.context=WARN

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
